<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mode Jelas Lansia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --text-secondary: #333333;
            --accent-blue: #0044cc; /* Biru Tua Kontras */
            --accent-alert: #d93025; /* Merah Bata untuk Penting */
            --highlight-bg: #e8f0fe;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif; /* Font paling mudah dibaca */
            color: var(--text-main);
            min-height: 100vh;
        }

        /* CARD UTAMA (KONTUR TEBAL) */
        .card-box {
            background: #ffffff;
            border: 3px solid #000000; /* Garis tebal hitam */
            border-radius: 16px;
            box-shadow: 4px 4px 0px #000000; /* Bayangan solid, bukan blur */
            margin-bottom: 24px;
        }

        /* CARD BESOK */
        .card-tomorrow {
            background: #fff8e1; /* Kuning pucat lembut */
            border: 3px solid #f57f17; /* Garis oranye tua */
            border-radius: 16px;
            box-shadow: 4px 4px 0px #f57f17;
        }

        /* LIST SHOLAT (BELANG-BELANG) */
        .prayer-row:nth-child(even) {
            background-color: #f2f2f2; /* Abu-abu muda untuk selang-seling */
        }
        .prayer-active {
            background-color: var(--highlight-bg) !important;
            border-left: 8px solid var(--accent-blue);
        }
        .prayer-time {
            font-variant-numeric: tabular-nums; /* Angka sejajar */
        }

        /* TOMBOL BESAR */
        .btn-large {
            background-color: var(--accent-blue);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border: 3px solid black;
            box-shadow: 4px 4px 0px black;
        }
        .btn-large:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px black;
        }

        /* KALENDER MODAL */
        #modal-content {
            border: 4px solid black;
        }
        .date-box {
            font-size: 1.2rem;
            font-weight: bold;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
        }
        .today-mark {
            background-color: var(--accent-blue);
            color: white;
            border: 2px solid black;
        }
    </style>
</head>
<body class="flex flex-col items-center px-4 pt-6 pb-12">

    <button onclick="getLocation()" class="w-full max-w-md mb-6 py-3 px-4 bg-gray-100 border-2 border-black rounded-xl flex items-center justify-center gap-3 active:bg-gray-200">
        <div class="w-4 h-4 rounded-full bg-green-600 animate-pulse"></div>
        <span id="lokasi-teks" class="text-lg font-bold text-black uppercase tracking-wide">LOKASI: BLITAR</span>
    </button>

    <div class="w-full max-w-md card-box p-6 text-center">
        <span class="text-xl font-bold text-gray-600 uppercase block mb-2 tracking-widest">HARI INI</span>
        
        <h1 id="clock-main" class="text-[5rem] font-black text-black leading-none mb-4">--:--</h1>
        
        <div class="border-t-4 border-black pt-4">
            <div class="flex flex-col items-center">
                <span id="hari-ini-nama" class="text-4xl font-black text-black uppercase mb-1">--</span>
                <span id="hari-ini-pasaran" class="text-3xl font-bold text-[#d93025] uppercase tracking-wide">--</span>
                <span id="hari-ini-tanggal" class="text-xl font-bold text-gray-700 mt-2">--</span>
                <span id="hari-ini-jawa" class="text-lg font-bold text-blue-800 bg-blue-100 px-4 py-1 rounded-lg mt-2 border border-blue-800">--</span>
            </div>
        </div>
    </div>

    <div class="w-full max-w-md card-tomorrow p-5 mb-8">
        <div class="flex justify-between items-center">
            <div>
                <span class="text-lg font-bold text-orange-800 uppercase block">BESOK:</span>
                <div class="flex items-baseline gap-2 mt-1">
                    <span id="besok-nama" class="text-2xl font-black text-black">--</span>
                    <span id="besok-pasaran" class="text-2xl font-bold text-[#d93025]">--</span>
                </div>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-orange-800" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 12h15" />
            </svg>
        </div>
    </div>

    <div class="w-full max-w-md card-box overflow-hidden mb-8">
        <div class="bg-black text-white p-4 text-center">
            <span class="text-xl font-bold uppercase tracking-widest">JADWAL SHOLAT</span>
        </div>
        <div id="prayer-list" class="text-lg">
            <div class="p-8 text-center font-bold">Memuat Data...</div>
        </div>
    </div>

    <button onclick="toggleModal(true)" class="w-full max-w-md btn-large py-4 rounded-xl flex items-center justify-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        BUKA KALENDER
    </button>

    <div id="modal-overlay" class="fixed inset-0 bg-white/90 z-50 hidden flex flex-col items-center justify-center p-2">
        <div id="modal-content" class="bg-white w-full max-w-sm rounded-xl shadow-2xl overflow-hidden">
            
            <div class="bg-black p-4 flex justify-between items-center">
                <h3 id="modal-month" class="text-2xl font-black text-white uppercase tracking-wide">--</h3>
                <button onclick="toggleModal(false)" class="bg-red-600 text-white px-4 py-2 rounded-lg font-bold border-2 border-white">
                    TUTUP X
                </button>
            </div>

            <div class="p-4">
                <div class="grid grid-cols-7 gap-1 text-center mb-4">
                    <div class="text-lg font-black text-red-600">M</div>
                    <div class="text-lg font-black text-black">S</div>
                    <div class="text-lg font-black text-black">S</div>
                    <div class="text-lg font-black text-black">R</div>
                    <div class="text-lg font-black text-black">K</div>
                    <div class="text-lg font-black text-black">J</div>
                    <div class="text-lg font-black text-black">S</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-black"></div>
            </div>
        </div>
    </div>

    <script>
        // --- DATA & LOGIC ---
        let userLat = -8.13, userLng = 112.15;
        let prayerTimesData = {};
        
        const pasaranArr = ["LEGI", "PAHING", "PON", "WAGE", "KLIWON"];
        const bulanJawa = ["Sura", "Sapar", "Mulud", "Bakda Mulud", "Jumadilawal", "Jumadilakhir", "Rejeb", "Ruwah", "Pasa", "Sawal", "Sela", "Besar"];
        const hariIndo = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const bulanIndo = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

        const refDate = new Date(2026, 0, 1);
        const refPasaranIdx = 2; 

        function getJavaneseData(dateObj) {
            const diffDays = Math.floor((dateObj - refDate) / 86400000);
            let pasaranIdx = (refPasaranIdx + diffDays) % 5;
            if (pasaranIdx < 0) pasaranIdx += 5;
            
            const hijriParts = new Intl.DateTimeFormat('id-ID-u-ca-islamic-umalqura', {
                day: 'numeric', month: 'numeric', year: 'numeric'
            }).formatToParts(dateObj);
            
            let hDay, hMonth, hYear;
            hijriParts.forEach(p => {
                if(p.type === 'day') hDay = p.value;
                if(p.type === 'month') hMonth = parseInt(p.value) - 1;
                if(p.type === 'year') hYear = parseInt(p.value);
            });

            return {
                dayName: hariIndo[dateObj.getDay()].toUpperCase(),
                dateMasehi: `${dateObj.getDate()} ${bulanIndo[dateObj.getMonth()].toUpperCase()} ${dateObj.getFullYear()}`,
                pasaran: pasaranArr[pasaranIdx],
                dateJawa: `${hDay} ${bulanJawa[hMonth]} ${hYear + 512}`
            };
        }

        // --- UPDATE UI ---
        function updateUI() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(now.getDate() + 1);

            document.getElementById('clock-main').innerText = 
                now.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});

            const todayData = getJavaneseData(now);
            document.getElementById('hari-ini-nama').innerText = todayData.dayName;
            document.getElementById('hari-ini-pasaran').innerText = todayData.pasaran;
            document.getElementById('hari-ini-tanggal').innerText = todayData.dateMasehi;
            document.getElementById('hari-ini-jawa').innerText = todayData.dateJawa + " JAWA";

            const besokData = getJavaneseData(tomorrow);
            document.getElementById('besok-nama').innerText = besokData.dayName;
            document.getElementById('besok-pasaran').innerText = besokData.pasaran;

            updateActivePrayer();
        }

        // --- MODAL LOGIC ---
        function toggleModal(show) {
            const overlay = document.getElementById('modal-overlay');
            if (show) {
                renderCalendar();
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        // --- CALENDAR RENDER ---
        function renderCalendar() {
            const now = new Date();
            document.getElementById('modal-month').innerText = `${bulanIndo[now.getMonth()]} ${now.getFullYear()}`;
            
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();

            for(let i=0; i<firstDay; i++) grid.innerHTML += '<div></div>';
            
            for(let d=1; d<=daysInMonth; d++) {
                const isToday = d === now.getDate();
                grid.innerHTML += `
                    <div class="date-box ${isToday ? 'today-mark' : 'bg-gray-50'}">
                        ${d}
                    </div>`;
            }
        }

        // --- PRAYER TIMES ---
        async function fetchJadwal() {
            const now = new Date();
            const url = `https://api.aladhan.com/v1/timings/${now.getDate()}-${now.getMonth()+1}-${now.getFullYear()}?latitude=${userLat}&longitude=${userLng}&method=20`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                prayerTimesData = data.data.timings;
                renderPrayerList();
            } catch (e) { console.log(e); }
        }

        function renderPrayerList() {
            const listEl = document.getElementById('prayer-list');
            listEl.innerHTML = '';
            const items = [
                {id: 'Imsak', label: 'IMSAK'}, {id: 'Fajr', label: 'SUBUH'},
                {id: 'Dhuhr', label: 'DZUHUR'}, {id: 'Asr', label: 'ASHAR'},
                {id: 'Maghrib', label: 'MAGHRIB'}, {id: 'Isha', label: 'ISYA'}
            ];

            items.forEach(item => {
                listEl.innerHTML += `
                    <div class="prayer-row flex justify-between p-4 border-b border-gray-300" id="row-${item.id}">
                        <span class="font-bold text-gray-700">${item.label}</span>
                        <span class="font-black text-black text-2xl prayer-time">${prayerTimesData[item.id]}</span>
                    </div>`;
            });
            updateActivePrayer();
        }

        function updateActivePrayer() {
            if(!Object.keys(prayerTimesData).length) return;
            const now = new Date();
            const keys = ['Imsak', 'Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
            let nextId = null, minDiff = Infinity;
            
            keys.forEach(k => document.getElementById(`row-${k}`)?.classList.remove('prayer-active'));
            keys.forEach(k => {
                const [h, m] = prayerTimesData[k].split(':');
                const t = new Date(); t.setHours(h, m, 0, 0);
                const diff = t - now;
                if(diff > 0 && diff < minDiff) { minDiff = diff; nextId = k; }
            });

            if(nextId) document.getElementById(`row-${nextId}`).classList.add('prayer-active');
        }

        function getLocation() {
            const txt = document.getElementById('lokasi-teks');
            txt.innerText = "MENCARI LOKASI...";
            navigator.geolocation.getCurrentPosition(pos => {
                userLat = pos.coords.latitude; userLng = pos.coords.longitude;
                txt.innerText = "LOKASI: GPS AKTIF";
                fetchJadwal();
            }, () => txt.innerText = "LOKASI: DEFAULT");
        }

        setInterval(updateUI, 1000);
        updateUI();
        fetchJadwal();
    </script>
</body>
</html>
